name: Historische US-Vorboersen-Analyse
on:
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: read
concurrency:
  group: premarket-historical-research
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research tools
        run: python -m pip install -r requirements.txt
      - name: Confirm source files compile
        run: python -m py_compile scripts/premarket_pipeline.py scripts/trading_core.py scripts/free_market.py
      - name: Check real historical data and run model + replays
        run: python scripts/premarket_pipeline.py --output-dir docs --replays 10000
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload report as web page
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish report
        id: deployment
        uses: actions/deploy-pages@v4
