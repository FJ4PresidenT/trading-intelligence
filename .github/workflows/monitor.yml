name: Dynamic trading watch monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 9-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '7 16 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: monitor-update
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market calendar
        run: python -m pip install 'exchange-calendars>=4.6,<6'
      - name: Research rotating watchlist
        run: python scripts/dynamic_monitor.py
      - name: Publish JSON as repository commit
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/monitor.json
          git diff --cached --quiet || (git commit -m 'Refresh dynamic watch research' && git push)
